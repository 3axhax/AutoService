services:
  server_auto_service:
    container_name: serverAutoService
    build:
      context: .
      dockerfile: server/DockerfileServer
      target: development
    env_file:
      - ./server/.development.env
    environment:
      NODE_ENV: development
      PORT: 5050
      POSTGRES_HOST: postgres_auto_service
      POSTGRES_PORT: 5432
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      postgres_auto_service:
        condition: service_healthy

  postgres_auto_service:
    container_name: postgresAutoService
    image: postgres:12
    env_file:
      - ./server/.postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  client_auto_service:
    container_name: clientAutoService
    build:
      context: .
      dockerfile: client/DockerfileClient
      target: development
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_BASE_API_URL=/api
      - API_PROXY_TARGET=http://server_auto_service:5050
volumes:
  pgdata:
